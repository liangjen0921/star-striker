<script>

var ctx=cvs.getContext('2d');
var W=cvs.width,H=cvs.height;

/* ============ 1. 音效 / 音樂(全部由 Web Audio 即時合成,無外部檔案) ============ */
var AC=null,master=null,sfxBus=null,musBus=null,musTimer=null;
var MUS_VOL=0.82;   /* 背景音樂音量(原 0.50) */
function ac(){
  if(AC)return AC;
  var Ctor=window.AudioContext||window.webkitAudioContext;
  if(!Ctor)return null;
  AC=new Ctor();
  master=AC.createGain();master.gain.value=0.9;master.connect(AC.destination);
  sfxBus=AC.createGain();sfxBus.gain.value=0.85;sfxBus.connect(master);
  musBus=AC.createGain();musBus.gain.value=MUS_VOL;musBus.connect(master);
  musTimer=setInterval(function(){musTick();},60);
  return AC;
}
function tone(o){
  if(!AC)return;
  var t=(o.t||0),dur=(o.dur===undefined?0.15:o.dur),end=t+dur;
  var vol=(o.vol===undefined?0.2:o.vol);
  if(vol<=0||dur<=0)return;
  var osc=AC.createOscillator(),g=AC.createGain();
  osc.type=o.type||'sine';
  osc.frequency.setValueAtTime(Math.max(20,o.f),AC.currentTime+t);
  if(o.f2)osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.f2),AC.currentTime+end);
  g.gain.setValueAtTime(0.0001,AC.currentTime+t);
  g.gain.linearRampToValueAtTime(vol,AC.currentTime+t+Math.min(0.012,dur*0.25));
  g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+end);
  osc.connect(g);g.connect(o.bus||sfxBus);
  osc.start(AC.currentTime+t);osc.stop(AC.currentTime+end+0.03);
}
function nz(o){
  if(!AC)return;
  var t=(o.t||0),dur=(o.dur===undefined?0.15:o.dur),end=t+dur;
  var vol=(o.vol===undefined?0.2:o.vol);
  if(vol<=0||dur<=0)return;
  var n=Math.max(1,Math.ceil(AC.sampleRate*dur));
  var buf=AC.createBuffer(1,n,AC.sampleRate),d=buf.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var src=AC.createBufferSource();src.buffer=buf;
  var f=AC.createBiquadFilter();f.type=o.type||'lowpass';
  f.frequency.setValueAtTime(Math.max(60,o.freq||900),AC.currentTime+t);
  if(o.f2)f.frequency.exponentialRampToValueAtTime(Math.max(60,o.f2),AC.currentTime+end);
  if(o.q)f.Q.value=o.q;
  var g=AC.createGain();
  g.gain.setValueAtTime(Math.max(0.0001,o.decay?vol*0.8:vol),AC.currentTime+t);
  g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+end);
  src.connect(f);f.connect(g);g.connect(o.bus||sfxBus);
  src.start(AC.currentTime+t);src.stop(AC.currentTime+end+0.03);
}
var SFX={};
SFX.click=function(){tone({f:620,f2:900,t:0,dur:0.05,type:'square',vol:0.10});};
SFX.shootPulse=function(){tone({f:880,f2:260,t:0,dur:0.07,type:'square',vol:0.10});};
SFX.shootSpread=function(){tone({f:660,f2:300,t:0,dur:0.06,type:'sawtooth',vol:0.075});
  tone({f:1180,f2:420,t:0.01,dur:0.06,type:'square',vol:0.045});};
SFX.shootLaser=function(){tone({f:1500,f2:2400,t:0,dur:0.13,type:'sawtooth',vol:0.07});
  tone({f:760,f2:380,t:0,dur:0.10,type:'triangle',vol:0.045});};
SFX.shootPlasma=function(){tone({f:170,f2:540,t:0,dur:0.16,type:'sine',vol:0.13});
  nz({t:0,dur:0.07,vol:0.05,freq:1800,f2:500});};
SFX.shootMissile=function(){nz({t:0,dur:0.18,vol:0.11,freq:560,f2:1700,q:4});
  tone({f:120,f2:230,t:0,dur:0.12,type:'sawtooth',vol:0.07});};
SFX.shootRail=function(){tone({f:2400,f2:170,t:0,dur:0.20,type:'sawtooth',vol:0.10});
  nz({t:0,dur:0.11,vol:0.13,freq:5200,f2:700,type:'highpass'});
  tone({f:70,f2:44,t:0,dur:0.18,type:'sine',vol:0.10});};
SFX.hit=function(){tone({f:1500,f2:1000,t:0,dur:0.04,type:'square',vol:0.05});};
SFX.boom=function(s){s=(s===undefined?1:s);
  nz({t:0,dur:0.30*s,vol:0.30,freq:1100,f2:80});
  tone({f:150,f2:38,t:0,dur:0.28*s,type:'triangle',vol:0.22});};
SFX.bigBoom=function(){
  nz({t:0,dur:0.55,vol:0.36,freq:1600,f2:60});
  nz({t:0.08,dur:0.5,vol:0.28,freq:700,f2:40});
  tone({f:110,f2:26,t:0,dur:0.90,type:'triangle',vol:0.28});
  tone({f:60,f2:24,t:0.10,dur:1.00,type:'sine',vol:0.24});};
SFX.pow=function(){tone({f:520,t:0,dur:0.07,type:'triangle',vol:0.13});
  tone({f:780,t:0.07,dur:0.07,type:'triangle',vol:0.13});
  tone({f:1170,t:0.14,dur:0.14,type:'triangle',vol:0.15});};
SFX.ammo=function(){tone({f:420,f2:900,t:0,dur:0.09,type:'square',vol:0.10});};
SFX.warn=function(){tone({f:300,f2:220,t:0,dur:0.16,type:'square',vol:0.09});
  tone({f:300,f2:220,t:0.20,dur:0.16,type:'square',vol:0.09});};
SFX.hurt=function(){tone({f:300,f2:70,t:0,dur:0.28,type:'sawtooth',vol:0.17});
  nz({t:0,dur:0.22,vol:0.16,freq:1300,f2:200});};
SFX.over=function(){tone({f:440,t:0,dur:0.30,type:'triangle',vol:0.13});
  tone({f:330,t:0.28,dur:0.30,type:'triangle',vol:0.13});
  tone({f:220,t:0.56,dur:0.70,type:'triangle',vol:0.14});};
SFX.fanfare=function(){
  var n=[523,659,784,1047,1319,1047,1319,1568];
  for(var i=0;i<n.length;i++)tone({f:n[i],t:i*0.115,dur:0.30,type:'triangle',vol:0.14,bus:musBus});
  tone({f:131,t:0,dur:1.00,type:'sine',vol:0.20,bus:musBus});
  tone({f:196,t:0.46,dur:0.70,type:'sine',vol:0.18,bus:musBus});
  nz({t:0,dur:0.12,vol:0.10,freq:6000,f2:2000,type:'highpass',bus:musBus});};
SFX.growl=function(){tone({f:80,f2:48,t:0,dur:0.50,type:'sawtooth',vol:0.14});
  nz({t:0,dur:0.36,vol:0.12,freq:420,f2:120,q:6});};

/* --- 背景音樂sequencer --- */
var MUS={mode:'off',step:0,next:0};
var SCALE=[0,2,4,7,9,12,14,16];
function setMusic(m){
  if(MUS.mode===m)return;
  MUS.mode=m;MUS.step=0;MUS.next=AC?AC.currentTime+0.06:0;
  if(musBus&&AC)musBus.gain.setValueAtTime(m==='off'?0.0001:0.5,AC.currentTime+0.05);
}
function musTick(){
  if(!AC||MUS.mode==='off')return;
  var stepLen=(MUS.mode==='boss')?0.125:0.25;
  var horizon=AC.currentTime+0.35;
  if(MUS.next<AC.currentTime)MUS.next=AC.currentTime+0.02;
  var guard=0;
  while(MUS.next<horizon&&guard++<48){
    var t=MUS.next-AC.currentTime,s=MUS.step;
    if(MUS.mode==='calm'){
      if(s%16===0){
        var ch=[0,7,12,19],b=110*Math.pow(2,1/12);
        for(var k=0;k<4;k++)tone({f:b*ch[k],t:t,dur:1.9,type:'triangle',vol:0.045,bus:musBus});
      }
      if(s%8===0)tone({f:88,f2:44,t:t,dur:0.18,type:'sine',vol:0.11,bus:musBus});
      var n=SCALE[(s*3+((s/8)|0))%SCALE.length];
      tone({f:220*Math.pow(2,n/12),t:t,dur:0.34,type:'triangle',vol:0.055,bus:musBus});
      if(s%2===1)tone({f:1320*Math.pow(2,SCALE[(s*5)%SCALE.length]/12),t:t,dur:0.12,type:'sine',vol:0.016,bus:musBus});
    }else if(MUS.mode==='boss'){
      if(s%4===0)tone({f:132,f2:44,t:t,dur:0.14,type:'sine',vol:0.20,bus:musBus});
      if(s%8===4||s%8===7)nz({t:t,dur:0.11,vol:0.10,freq:2400,f2:700,bus:musBus});
      if(s%2===1)nz({t:t,dur:0.035,vol:0.030,freq:9000,type:'highpass',bus:musBus});
      if(s%2===0){
        var seq=[0,12,7,12,3,12,7,10];
        var deg=[0,0,5,3][((s/4)|0)%4];
        var root=110*Math.pow(2,deg/12);
        tone({f:root*2*Math.pow(2,seq[(s/2)%8]/12),t:t,dur:0.10,type:'sawtooth',vol:0.045,bus:musBus});
      }
      if(s%8===0){
        var d2=[0,0,5,3][((s/8)|0)%4];
        tone({f:55*Math.pow(2,d2/12),t:t,dur:0.45,type:'square',vol:0.055,bus:musBus});
      }
    }
    MUS.step++;MUS.next+=stepLen;
  }
}

var SHIPS=[

  {id:'vector', name:'均衡型', desc:'各项平均・新手友善',   rateMul:1.00,dmgMul:1.00,speed:340,hp:4,drones:0,ammo:'pulse',   color:'#6bff9e'},
  {id:'wing',   name:'翼騎',   desc:'天生雙連散射',        rateMul:0.95,dmgMul:0.85,speed:310,hp:4,drones:0,ammo:'spread',  color:'#c9a2ff'},

};

  tank:   {r:31,hp:6.0, spd:42, score:50, color:'#b98cff',bc:'#d9b3ff'},

};

/* ============ 3. 狀態 ============ */
var S={MENU:0,PLAY:1,PAUSE:2,OVER:3,CLEAR:4};
var state=S.MENU;
var keys={},shipIdx=2;
var player=null;
var bullets=[],foes=[],foeBullets=[],parts=[],drops=[],stars=[],drones=[],rings=[],booms=[];
var boss=null,slowmo=1,slowT=0;

try{best=parseInt(localStorage.getItem('starstriker.bestMobile')||'0',10)||0;}catch(e){best=0;}
var DRONE_CAP=15,SPREAD_CAP=20,BOSS_SHIELD=true;
/* ---- 平衡參數(集中這裡,方便調整) ---- */
var DMG_SCALE=0.70;        /* 玩家攻擊力整體縮放(原 1.00) */
var LVL_DMG=0.10;          /* 彈藥每級傷害增量(原 0.13) */
var UP_DMG=1.15;           /* 「傷害+」每級倍率(原 1.20) */
var DROP_CHANCE=0.22;      /* 一般敵機掉落率(原 0.34) */
var BIG_DROP_CHANCE=0.75;  /* 大型敵機必定掉落 → 改為 75% */
var UP_SUB=0.18;           /* 掉落物中「永久強化」占比(原 0.22) */

function makePlayer(){
  var sh=SHIPS[shipIdx];
  var lv={};for(var i=0;i<AMMO_KEYS.length;i++)lv[AMMO_KEYS[i]]=1;
  var extraHp=DIF().hpAdd;               /* 批次6:保守 +1 格裝甲,硬核 -1 格 */
  var hp=Math.max(2,sh.hp+extraHp);
  return {x:W/2,y:H-90,r:15,speed:sh.speed,cool:0,hp:hp,maxhp:hp,inv:1.2*DIF().inv,alive:true,
    bank:0,ammo:sh.ammo,ammoLvl:lv,up:{rapid:0,dmg:0,spread:0,drone:0},dcool:0};
}
function reset(){
  player=makePlayer();

  boss=null;slowmo=1;slowT=0;
  score=0;wave=0;spawnLeft=0;betweenWaves=false;waveTimer=0;spawnTimer=0;
  shake=0;flash=0;clearT=0;shotN=0;
  dropIdx=0;dropPool=['rapid','dmg','drone','rapid','dmg','spread'];
  bossKills=0;formQ=[];pauseIdx=0;foesSingle=0;foesForm=0;

  dronesMake();
}
function dronesMake(){
  drones=[];
  var n=Math.min(DRONE_CAP,SHIPS[shipIdx].drones+player.up.drone);
  for(var i=0;i<n;i++)drones.push({x:player.x,y:player.y,ang:i*Math.PI*2/Math.max(1,n),cool:0.1+i*(1/3)/Math.max(1,n)});
}
function fireInterval(){
  var sh=SHIPS[shipIdx];
  /* 批次6:射速強化只算到 RAPID_EFF 級,之後再抽 rapid 也不會把射速推到失控 */
  var v=AMMO[player.ammo].rate*sh.rateMul*Math.pow(0.88,Math.min(player.up.rapid,RAPID_EFF));
  return Math.max(0.045,v);
}
function upDmgFactor(){
  /* 批次6:傷害強化前 DMG_SOFT 級每級 +15%,之後每級只有 +6%(邊際遞減) */
  var d=player?player.up.dmg:0;
  return Math.pow(UP_DMG,Math.min(d,DMG_SOFT))*Math.pow(DMG_SOFT_MUL,Math.max(0,d-DMG_SOFT));
}
function shotDamage(){
  var k=player.ammo,a=AMMO[k];
  return DMG_SCALE*a.dmg*(1+LVL_DMG*(player.ammoLvl[k]-1))*SHIPS[shipIdx].dmgMul*upDmgFactor();
}

/* ============ 4. 輸入 ============ */
window.addEventListener('keydown',function(e){
  var k=e.key;
  if(k===' '||k.indexOf('Arrow')===0)e.preventDefault();
  if(keys[k])return;
  keys[k]=true;
  if(k==='Enter'){
    if(state===S.MENU){startGame();}
    else if(state===S.CLEAR){clearT=99;}
    else if(state===S.OVER){setState(S.MENU);}
    else if(state===S.PAUSE){pauseAct();}
  }
  if((k==='r'||k==='R')&&(state===S.OVER||state===S.PAUSE))startGame();
  if(k==='p'||k==='P'||k==='Escape'){
    if(state===S.PLAY){pauseIdx=0;setState(S.PAUSE);setMusic('off');}
    else if(state===S.PAUSE){setState(S.PLAY);setMusic(musicOn?(boss?'boss':'calm'):'off');}
  }
  if(state===S.PAUSE&&(k==='ArrowUp'||k==='w'||k==='W')){pauseIdx=(pauseIdx+pmenuRows()-1)%pmenuRows();SFX.click();}
  if(state===S.PAUSE&&(k==='ArrowDown'||k==='s'||k==='S')){pauseIdx=(pauseIdx+1)%pmenuRows();SFX.click();}
  if(k==='m'||k==='M'){
    moToggleMusic();
  }
  if(k==='z'||k==='Z'){
    moWepSwitch(1);                       /* 批次5:與觸控武器鈕同一條路徑 */
  }
  if(state===S.MENU){
    /* 批次6:難度 1/2/3 直接選,X 循環 */
    if(k==='1'){moDiffSet(0);SFX.click();}
    if(k==='2'){moDiffSet(1);SFX.click();}
    if(k==='3'){moDiffSet(2);SFX.click();}
    if(k==='x'||k==='X'){moDiffCycle();SFX.click();}
    if(k==='ArrowLeft'||k==='a'||k==='A'){shipIdx=(shipIdx+SHIPS.length-1)%SHIPS.length;SFX.click();}
    if(k==='ArrowRight'||k==='d'||k==='D'){shipIdx=(shipIdx+1)%SHIPS.length;SFX.click();}
    if(k==='ArrowUp'||k==='w'||k==='W'){sizeIdx=(sizeIdx+1)%SIZES.length;applySize();SFX.click();}
    if(k==='ArrowDown'||k==='s'||k==='S'){sizeIdx=(sizeIdx+SIZES.length-1)%SIZES.length;applySize();SFX.click();}
  }
  if(state===S.OVER&&(k==='ArrowUp'||k==='w'||k==='W'))setState(S.MENU);
});
window.addEventListener('keyup',function(e){keys[e.key]=false;});

var MO_VIBE=('vibrate' in navigator)&&/android/i.test(navigator.userAgent||'');
function moVibe(ms){if(MO_VIBE){try{navigator.vibrate(ms);}catch(e){}}}
var MO_ST={down:false,id:null,fx:0,fy:0,ax:0,ay:0};   /* ax/ay = 虛擬手指點 */
MO_FINGER_Y_MIN=MO_H*(1-MO_FINGER_ZONE);
function moZoneTop(){return H*(1-MO_FINGER_ZONE);}
function moUnlockAudio(){
  var a=ac();
  if(a){try{if(a.state&&a.state!=='running')a.resume();}catch(e){}}
}
function moLogical(cx,cy){   /* 螢幕座標 → 畫布邏輯座標(依實際 CSS 縮放尺寸) */
  var r=cvs.getBoundingClientRect();
  var sx=(r.width?W/r.width:1),sy=(r.height?H/r.height:1);
  return {x:(cx-r.left)*sx,y:(cy-r.top)*sy};
}
function touchStart(x,y){
  moUnlockAudio();
  if(moTapAt(x,y))return;                        /* 批次3:按鈕判定優先於拖曳(炸彈鈕在控制區內也不能誤觸拖曳) */
  if(!player||!player.alive)return;
  if(MO_ST.down)return;                        /* 只認第一根手指 */
  if(y<moZoneTop())return;                     /* 只接受下方 MO_FINGER_ZONE 控制區 */
  MO_ST.down=true;MO_ST.fx=x;MO_ST.fy=y;
  MO_ST.ax=player.x;MO_ST.ay=player.y+MO_FINGER_OFF;   /* 起點對齊飛船,不瞬移 */
}
function touchMove(x,y){
  if(!MO_ST.down)return;
  MO_ST.ax+=(x-MO_ST.fx);MO_ST.ay+=(y-MO_ST.fy);
  MO_ST.fx=x;MO_ST.fy=y;
}
function touchEnd(){MO_ST.down=false;MO_ST.id=null;}
function moTouchTarget(){                      /* 飛船目標 = 虛擬手指點上方 MO_FINGER_OFF */
  var gx=MO_ST.ax,gy=MO_ST.ay-MO_FINGER_OFF;
  return {x:Math.max(18,Math.min(W-18,gx)),y:Math.max(60,Math.min(H-24,gy))};
}

  if(state!==S.PLAY||!player||!player.alive)return false;
  var N=AMMO_ORDER.length,i=AMMO_ORDER.indexOf(player.ammo);
  if(i<0)i=0;
  var j=(i+dir%N+N)%N;
  if(j===i)return false;
  player.ammo=AMMO_ORDER[j];
  SFX.ammo();
  bannerMain('彈藥: '+AMMO[player.ammo].name,AMMO[player.ammo].desc,0.7,AMMO[player.ammo].color);
  return true;

function moTouchAt(type,e){
  var t=null,i;
  if(type==='start'){
    t=(e.changedTouches&&e.changedTouches[0])||(e.touches&&e.touches[0])||null;
    if(!t||MO_ST.down)return;                  /* 多餘的手指一律忽略 */
    MO_ST.id=t.identifier;
  }else{
    var lst=e.changedTouches||[];
    for(i=0;i<lst.length;i++){if(lst[i].identifier===MO_ST.id){t=lst[i];break;}}
  }
  if(!t)return;
  var p=moLogical(t.clientX,t.clientY);
  if(type==='start')touchStart(p.x,p.y);
  else if(type==='move')touchMove(p.x,p.y);
  else touchEnd();                             /* touchend / touchcancel 都算放開 */
}
if('ontouchstart' in window||window.TouchEvent){
  window.addEventListener('touchstart',function(e){e.preventDefault();moTouchAt('start',e);},{passive:false});
  window.addEventListener('touchmove',function(e){e.preventDefault();moTouchAt('move',e);},{passive:false});
  window.addEventListener('touchend',function(e){e.preventDefault();moTouchAt('end',e);},{passive:false});
  window.addEventListener('touchcancel',function(e){e.preventDefault();moTouchAt('cancel',e);},{passive:false});
  window.addEventListener('contextmenu',function(e){e.preventDefault();});
}

function moFit(){

  var cs=getComputedStyle(stg);
  var aw=stg.clientWidth-(parseFloat(cs.paddingLeft)||0)-(parseFloat(cs.paddingRight)||0);
  var ah=stg.clientHeight-(parseFloat(cs.paddingTop)||0)-(parseFloat(cs.paddingBottom)||0);
  if(!(aw>0)||!(ah>0))return;
  var s=Math.min(aw/W,ah/H);
  cvs.style.width=Math.round(W*s)+'px';cvs.style.height=Math.round(H*s)+'px';
}

/* ============ 5. 繪圖工具:光暁圖集 / 粒子 / 星域背景 ============ */
var GLOWC={},BG=null,nebT=0,BGH=0;   /* BGH = 背景圖高度,只做一次,tiling 與滾動都用它 */
function hexA(hex,a){
  var h=hex.charAt(0)==='#'?hex.slice(1):hex;
  if(h.length===3)h=h.charAt(0)+h.charAt(0)+h.charAt(1)+h.charAt(1)+h.charAt(2)+h.charAt(2);
  var n=parseInt(h,16);
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';
}
function glowSprite(hex){
  var g=GLOWC[hex];
  if(g)return g;
  var s=96,cv=document.createElement('canvas');
  cv.width=s;cv.height=s;
  var c=cv.getContext('2d');
  var gr=c.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  gr.addColorStop(0,hexA(hex,0.95));
  gr.addColorStop(0.35,hexA(hex,0.38));
  gr.addColorStop(1,hexA(hex,0));
  c.fillStyle=gr;c.fillRect(0,0,s,s);
  GLOWC[hex]=cv;return cv;
}
function glow(x,y,r,hex,a){
  if(r<=0)return;
  ctx.globalAlpha=a;
  ctx.drawImage(glowSprite(hex),x-r,y-r,r*2,r*2);
  ctx.globalAlpha=1;
}
function line(x1,y1,x2,y2,hex,w,a){
  ctx.globalAlpha=a;ctx.strokeStyle=hex;ctx.lineWidth=w;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  ctx.globalAlpha=1;ctx.lineWidth=1;
}
function poly(pts,fill,stroke,w){
  ctx.beginPath();
  ctx.moveTo(pts[0][0],pts[0][1]);
  for(var i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=w||2;ctx.stroke();ctx.lineWidth=1;}
}
function text(s,x,y,size,color,align,glowc,alpha){
  if(size<MO_TEXT_MIN)size=MO_TEXT_MIN;   /* 批次3:最小字級在下發源頭統一,不改各呼叫端 */
  ctx.globalAlpha=(alpha===undefined?1:alpha);
  ctx.font='bold '+size+'px "Microsoft JhengHei",monospace';
  ctx.textAlign=align||'center';
  if(glowc){ctx.fillStyle=glowc;ctx.globalAlpha=(alpha===undefined?1:alpha)*0.35;ctx.fillText(s,x+2,y+2);
    ctx.globalAlpha=(alpha===undefined?1:alpha);}
  ctx.fillStyle=color;ctx.fillText(s,x,y);
  ctx.textAlign='left';ctx.globalAlpha=1;
}

function makeStars(){
  stars=[];
  for(var L=0;L<3;L++){
    var n=(L===0?70:(L===1?45:26));
    for(var i=0;i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*H,L:L,
      s:(L===0?0.8:(L===1?1.5:2.4)),sp:(L===0?40:(L===1?90:170)),tw:Math.random()*6.28});
  }
}
function makeNebula(){
  BGH=H*2;                                        /* 任務2:背景高度只用這一個變數 */
  BG=document.createElement('canvas');
  BG.width=W;BG.height=BGH;
  var c=BG.getContext('2d');
  c.fillStyle='#05070f';c.fillRect(0,0,W,BGH);
  var cols=['#1b2a6b','#3a1b5e','#0e4a52','#4a1b33','#123a2e','#2b1e5a'];
  /* 任務2:每團暈開的色塊另外画上下左右共 9 份(只画有碰到畫布的那幾份),
     所以 canvas 邊緣不會被硬切,上下兩張拼接處不會出現水平硬邊/矩形色塊 */
  function blob(x,y,r,col){
    for(var oy=-1;oy<=1;oy++){
      for(var ox=-1;ox<=1;ox++){
        var px=x+ox*W,py=y+oy*BGH;
        if(px+r<0||px-r>W||py+r<0||py-r>BGH)continue;
        var gr=c.createRadialGradient(px,py,0,px,py,r);
        gr.addColorStop(0,hexA(col,0.30));
        gr.addColorStop(0.65,hexA(col,0.10));
        gr.addColorStop(1,hexA(col,0));
        c.fillStyle=gr;c.beginPath();c.arc(px,py,r,0,6.2832);c.fill();
      }
    }
  }
  for(var i=0;i<16;i++){
    blob(Math.random()*W,Math.random()*BGH,120+Math.random()*240,cols[(Math.random()*cols.length)|0]);
  }
  for(var j=0;j<420;j++){
    var a2=Math.random()*0.45;
    c.fillStyle='rgba(255,255,255,'+a2.toFixed(3)+')';
    c.fillRect((Math.random()*W)|0,(Math.random()*BGH)|0,1,1);
  }
}
function drawBG(dt){
  ctx.fillStyle='#04060d';ctx.fillRect(0,0,W,H);
  if(BG){
    nebT=(nebT+dt*22)%BGH;                        /* 兩張的起點剛好差 BGH,無縫接軌 */
    ctx.drawImage(BG,0,nebT-BGH);
    ctx.drawImage(BG,0,nebT);
  }
  for(var i=0;i<stars.length;i++){
    var s=stars[i];
    s.y+=s.sp*dt;
    if(s.y>H){s.y-=H;s.x=Math.random()*W;}
    s.tw+=dt*3;
    var a=(s.L===0?0.30:(s.L===1?0.55:0.85))*(0.7+0.3*Math.sin(s.tw));
    ctx.globalAlpha=a;
    ctx.fillStyle=(s.L===2?'#cfe4ff':'#ffffff');
    ctx.fillRect(s.x,s.y,s.s,s.s);
  }
  ctx.globalAlpha=1;
}

function spark(x,y,c,n,pow){

    part(x,y,Math.cos(a)*sp,Math.sin(a)*sp,0.25+Math.random()*0.4,1+Math.random()*2.4,c,true);

}

  part(x,y,(Math.random()-0.5)*30,(Math.random()*40+20),0.35+Math.random()*0.25,2+Math.random()*2,c,true,0.6);

function boom(x,y,size,color,quiet,shk,nofl){
  spark(x,y,color,Math.min(46,10+size*3),size*9);
  for(var i=0;i<3;i++)part(x,y,(Math.random()-0.5)*60,(Math.random()-0.5)*60,0.5+Math.random()*0.4,size*0.9+4,'#ffffff',true,0.4);
  ring(x,y,size*0.4,size*3.2,0.35,'#ffffff',3);
  ring(x,y,size*0.2,size*2.4,0.5,color,5);
  if(!nofl)flash=Math.min(0.5,flash+size*(0.008+FLASH_SHOT));
  if(!shakeMute)shake=Math.min(26,shake+size*(shk===undefined?0.5:shk));   /* 批次8:旗標開時不震 */
  if(!quiet)SFX.boom(Math.min(1.4,0.6+size*0.06));
}
function glowBall(x,y,r,c){   /* 批次7:命中點局部光球,取代全屏閃爍 */
  if(r<=0)return;
  part(x,y,0,0,0.18,r*0.42,'#ffffff',true,0.9);
  part(x,y,0,0,0.30,r,c,true,0.6);
}
function boomQueue(x,y,size,color,delay){booms.push({x:x,y:y,s:size,c:color,t:delay});}
function updateBooms(dt){
  for(var i=booms.length-1;i>=0;i--){
    var b=booms[i];b.t-=dt;
    if(b.t<=0){boom(b.x,b.y,b.s,b.c);booms.splice(i,1);}
  }
}
function updateParts(dt){
  for(var i=parts.length-1;i>=0;i--){
    var p=parts[i];
    p.t+=dt;
    if(p.t>=p.life){parts.splice(i,1);continue;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    p.vx*=0.985;p.vy*=0.985;
  }
}
function drawParts(){
  for(var i=0;i<parts.length;i++){
    var p=parts[i],a=1-p.t/p.life;
    if(p.gl)glow(p.x,p.y,p.r*3.2,p.c,a*0.55);
    ctx.globalAlpha=a*p.f;
    ctx.fillStyle=p.c;
    ctx.fillRect(p.x-p.r,p.y-p.r,p.r*2,p.r*2);
  }
  ctx.globalAlpha=1;
}
function updateRings(dt){
  for(var i=rings.length-1;i>=0;i--){
    var r=rings[i];r.t+=dt;
    if(r.t>=r.life)rings.splice(i,1);
  }
}
function drawRings(){
  for(var i=0;i<rings.length;i++){
    var r=rings[i],k=r.t/r.life;
    var rad=r.r+(r.r1-r.r)*k;
    ctx.globalAlpha=(1-k)*0.8;
    ctx.strokeStyle=r.c;ctx.lineWidth=r.w*(1-k)+1;
    ctx.beginPath();ctx.arc(r.x,r.y,rad,0,6.2832);ctx.stroke();
  }
  ctx.globalAlpha=1;ctx.lineWidth=1;
}
function bannerMain(m,s,d,c){

function pickType(){
  var w=[['grunt',30]];
  if(wave>=2)w.push(['zig',18]);
  if(wave>=3)w.push(['shooter',13]);
  if(wave>=4)w.push(['diver',13]);
  if(wave>=5)w.push(['tank',8]);
  if(wave>=6)w.push(['bomber',11]);
  if(wave>=7)w.push(['splitter',9]);
  /* 批次6:第 12 波之後重裝敵機(tank/bomber/splitter)占比逐步提高 */
  if(wave>=12){
    var hb=Math.min(18,(wave-11)*1.5);
    for(var q=0;q<w.length;q++)
      if(w[q][0]==='tank'||w[q][0]==='bomber'||w[q][0]==='splitter')w[q][1]+=hb;
  }
  var tot=0,i;
  for(i=0;i<w.length;i++)tot+=w[i][1];
  var r=Math.random()*tot;
  for(i=0;i<w.length;i++){r-=w[i][1];if(r<=0)return w[i][0];}
  return 'grunt';
}
function spawnFoe(type,x,y){
  var d=FOES[type];

  var f={type:type,x:x,y:y,r:foeR(type),hp:d.hp*hpMul*easyHp(),
    spd:d.spd*(1+wave*0.012+Math.max(0,wave-LATE_FROM)*LATE_SPD),score:d.score,
    color:d.color,bc:d.bc,t:0,ph:Math.random()*6.28,fire:0.8+Math.random()*1.4,flash:0,
    vy:d.spd,spin:0,dead:false,id:++foeId};
  if(type==='bomber')f.vy=d.spd*0.6;
  if(type==='diver'){f.vy=0;f.x=player?player.x:W/2;}
  foes.push(f);
  return f;
}
var foeId=0;
function foeBullet(x,y,ang,spd,r,color,opt){
  if(foeBullets.length>MO_CAP_FOEB)return null;
  var bb={x:x,y:y,vx:Math.cos(ang)*spd*MO_SX,vy:Math.sin(ang)*spd*MO_SY,r:r,c:color,t:0};
  if(opt){                                  /* 批次5C:追蹤彈 opt={h:每秒最大轉向弧度, hl:追蹤秒數} */
    if(opt.h){bb.h=opt.h;bb.hl=opt.hl||2.0;}
    if(opt.w)bb.w=1;                        /* 視覺:飛彈尾焰 */
  }
  foeBullets.push(bb);
  return bb;
}
function foeShootAimed(f,spd){

function fanFoe(f,n,base,step,spd){
  var m=moN(n);
  for(var i=0;i<m;i++)foeBullet(f.x,f.y+f.r*0.5,base+(i-(m-1)/2)*step,spd,f.r*0.3,f.bc);

var FORMN=['單縱隊','雙縱隊','橫隊','雁行陣','菱形陣','菱形護衛','左右夾擊','蛇形S','交叉對角','慢速鐵幕','環形合圍'];
/* ---- 批次5:編隊解放表 [kind, 解放波數, 基礎權重](後期編隊權重隨波數遞增,前期仍以基本陣形為主) ---- */
var FORM_UNLOCK=[[0,1,10],[1,1,9],[2,1,8],[3,2,7],[4,3,6],
                 [5,4,6],[6,5,6],[7,6,6],[8,8,5],[9,10,5],[10,12,5]];
function formPick(){
  var tot=0,i,k,w,r;
  for(i=0;i<FORM_UNLOCK.length;i++){
    k=FORM_UNLOCK[i];
    if(wave<k[1])continue;
    tot+=k[2]+Math.min(6,wave-k[1]);
  }
  if(tot<=0)return 0;
  r=Math.random()*tot;
  for(i=0;i<FORM_UNLOCK.length;i++){
    k=FORM_UNLOCK[i];
    if(wave<k[1])continue;
    w=k[2]+Math.min(6,wave-k[1]);
    r-=w;
    if(r<=0)return k[0];
  }
  return 0;
}
function formationPts(kind,n){
  var pts=[],i,m,k,side;
  if(kind===0){                       /* 一字縱隊 */
    var cx=W*0.22+Math.random()*W*0.56;
    for(i=0;i<n;i++)pts.push([cx,-34-i*50,i*0.12]);
  }else if(kind===1){                 /* 左右對稱雙縱隊 */
    var c2=W*0.3+Math.random()*W*0.4;
    m=Math.ceil(n/2);
    for(i=0;i<m;i++){pts.push([c2-72,-34-i*50,i*0.12]);pts.push([c2+72,-34-i*50,i*0.12]);}
  }else if(kind===2){                 /* 橫向橫隊(手機版單列最多 MO_FORM_ROW_MAX 架,超過拆多列) */
    var per=MO_FORM_ROW_MAX,rows=Math.ceil(n/per);
    for(var rw=0;rw<rows;rw++){
      var cnt=Math.min(per,n-rw*per);
      var sp2=Math.min(96,(W-100)/Math.max(1,cnt-1));
      for(k=0;k<cnt;k++)pts.push([W/2-(cnt-1)*sp2/2+k*sp2,-32-rw*64-(k%2)*16,(rw*per+k)*0.05]);
    }
  }else if(kind===3){                 /* 雁行陣(V) */
    var maxo=Math.ceil((n-1)/2)*54;
    var c3=(maxo*2>W-90)?W/2:(W*0.25+Math.random()*W*0.5);
    c3=Math.max(46+maxo,Math.min(W-46-maxo,c3));
    pts.push([c3,-36,0]);
    for(i=1;i<n;i++){side=(i%2)?1:-1;k=Math.ceil(i/2);pts.push([c3+side*k*54,-36-k*46,k*0.10]);}
  }else if(kind===4){                 /* 菱形陣 */
    var c4=W*0.25+Math.random()*W*0.5;
    pts.push([c4,-36,0]);
    pts.push([c4-56,-36-44,0.14]);pts.push([c4+56,-36-44,0.14]);
    pts.push([c4,-36-88,0.24]);
    if(n>5)pts.push([c4-96,-36-88,0.30]);
    if(n>6)pts.push([c4+96,-36-88,0.30]);
  }else if(kind===5){                 /* 菱形護衛隊:四機護航把中央重裝機包在中間 */
    var c5=W*0.28+Math.random()*W*0.44;
    pts.push([c5-58,-36,0.00,'grunt']);
    pts.push([c5+58,-36,0.00,'grunt']);
    pts.push([c5,-36,0.30,'tank']);                 /* 本體晚一點進場,先被護航擋住 */
    pts.push([c5-104,-36-52,0.12,'zig']);
    pts.push([c5+104,-36-52,0.12,'zig']);
  }else if(kind===6){                 /* 左右夾擊:貼兩側的雙縱隊,鋸齒機邊走邊往中間切 */
    var lx=Math.max(46,W*0.15),rx=Math.min(W-46,W*0.85);
    m=Math.ceil(n/2);
    for(i=0;i<m;i++){
      pts.push([lx,-34-i*56,i*0.10,'zig']);
      pts.push([rx,-34-i*56,i*0.10+0.06,'zig']);
    }
  }else if(kind===7){                 /* 蛇形S曲線:單列連成一条 S,波形橫幅不會超出畫布 */
    var amp7=Math.min(W/2-46,124),ph7=Math.random()*6.28;
    for(i=0;i<n;i++)pts.push([W/2+Math.sin(ph7+i*0.85)*amp7,-34-i*46,i*0.13,'grunt']);
  }else if(kind===8){                 /* 交叉對角線:兩條對角線錯開時間進場,在畫面中央交叉 */
    m=Math.max(2,Math.ceil(n/2));
    var dx8=(W-72)/Math.max(1,m-1);
    for(i=0;i<m;i++){
      pts.push([36+i*dx8,-34-i*50,i*0.06,'zig']);
      pts.push([W-36-i*dx8,-34-i*50,i*0.06+0.34,'shooter']);
    }
  }else if(kind===9){                 /* 慢速鐵幕:整排慢速壓下,只留一個可穿過的缺口(兩側留邊,不會貼死) */
    var cnt9=MO_FORM_ROW_MAX+2,hole9=1+((Math.random()*(cnt9-2))|0),sp9=(W-72)/(cnt9-1);
    for(i=0;i<cnt9;i++){
      if(i===hole9)continue;
      pts.push([36+i*sp9,-32-(i%2)*18,i*0.04,'grunt',0.50]);
    }
  }else{                              /* 環形合圍:上半圓罩下來,正中央刻意留出口 */
    var R10=Math.min(W*0.42,168),cnt10=Math.max(6,Math.min(9,n+2)),a10,x10;
    for(i=0;i<cnt10;i++){
      a10=Math.PI*(i+0.5)/cnt10;
      x10=W/2-Math.cos(a10)*R10;
      if(Math.abs(x10-W/2)<52)continue;             /* 中央出口 */
      pts.push([x10,-40-Math.sin(a10)*R10*0.55,i*0.05,'grunt',0.78]);
    }
  }
  for(i=0;i<pts.length;i++)pts[i][0]=Math.max(34,Math.min(W-34,pts[i][0]));
  return pts;
}
function spawnFormation(){
  var t=pickType();
  if(t==='diver')t='grunt';                 /* 突襲型會脱隊,不排入編隊 */
  var kind=formPick();                       /* 批次5:依波數加權解鎖(不再 5 種均分) */
  var want=FORM_SIZE+((Math.random()*4)|0);      /* 4~7,橫隊/菱形可能更多 */
  var pts=formationPts(kind,want);
  var fr,xlo,xhi,q;
  for(var i=0;i<pts.length;i++){
    q=(pts[i][3]||t);                        /* 點位可指定機型(護衛/夾擊/鐵幕) */
    fr=foeR(q);xlo=fr+2;xhi=W-fr-2;          /* 所有生成 x 落在 [r+2, W-r-2] */
    formQ.push({type:q,x:Math.max(xlo,Math.min(xhi,pts[i][0])),y:pts[i][1],
      d:pts[i][2],sm:pts[i][4]||1});         /* sm=速度倍率(慢速鐵幕/環形用) */
  }
  if(Math.random()<0.5)bannerMain('敵機編隊',''+FORMN[kind],1.0,'#ff9f43');
  return pts.length;
}
function updateWaves(dt){
  if(betweenWaves){
    /* 批次5:BOSS 前的 3 秒警告(紅色大標題閃爍 + 低频嗶聲),倒數結束才真正出場 */
    if(bossWarn>0){
      bossWarn-=dt;warnBeep-=dt;
      if(warnBeep<=0){warnBeep=MO_BOSS_WARN_BEEP;tone({f:190,f2:120,t:0,dur:0.30,type:'square',vol:0.075});}
      if(bossWarn<0)bossWarn=0;
    }
    waveTimer-=dt;
    if(waveTimer<=0)startWave();
    return;
  }
  if(!boss&&spawnLeft>0){
    spawnTimer-=dt;
    if(spawnTimer<=0){
      var gap=Math.max(0.28,0.85-wave*0.035);
      if(wave>=2&&spawnLeft>=FORM_MIN&&Math.random()<FORM_CHANCE){
        var fn=spawnFormation();
        foesForm+=fn;spawnLeft-=fn;
        spawnTimer=gap*1.7+0.40;
      }else{
        foesSingle++;
        spawnTimer=gap*(SINGLE_GAP+Math.random()*0.8);
        spawnFoe(pickType(),40+Math.random()*(W-80),-30-Math.random()*40);
        spawnLeft--;
      }
    }
  }
  for(var fi=formQ.length-1;fi>=0;fi--){
    var qq=formQ[fi];qq.d-=dt;
    if(qq.d<=0){
      var mf=spawnFoe(qq.type,qq.x,qq.y);
      if(mf&&qq.sm&&qq.sm!==1){mf.spd*=qq.sm;if(mf.vy>0)mf.vy*=qq.sm;}   /* 批次5:慢速編隊 */
      formQ.splice(fi,1);
    }
  }
  if(!boss&&spawnLeft<=0&&foes.length===0&&formQ.length===0&&!betweenWaves){
    var giveUp=(wave%2===0);
    bannerMain('WAVE '+wave+' 清除',giveUp?'獎勵強化即將送達':'戰場上可能還有獎勵',1.5,'#7cff6b');
    betweenWaves=true;
    if((wave+1)%5===0){bossWarn=MO_BOSS_WARN;warnBeep=0;waveTimer=bossWarn;}   /* 批次5:下一波是 BOSS → 3 秒警告 */
    else{bossWarn=0;waveTimer=1.9;}
    if(bombs<MO_BOMB_MAX)bombs=Math.min(MO_BOMB_MAX,bombs+MO_BOMB_WAVE);   /* 批次3:清一波補炸彈 */
    drop(W/2-60,60,giveUp?'up':null);
  }
}

/* ============ 7. BOSS ============ */
function bossHpScale(){
  if(!player)return 1;
  var u=player.up.rapid+player.up.dmg+player.up.spread+player.up.drone;
  var lv=0,n=0;
  for(var i=0;i<AMMO_KEYS.length;i++){lv+=player.ammoLvl[AMMO_KEYS[i]];n++;}
  var avg=n?lv/n:1;
  return Math.min(4.0,1+u*HPS_UP+(avg-1)*HPS_LV);
}
function spawnBoss(tier){
  var hp=Math.round((BOSS_HP0+BOSS_HP1*tier+BOSS_HP2*tier*tier)*bossHpScale()*easyHp());
  boss={x:W/2,y:-90,r:52+tier*5,hp:hp,maxhp:hp,tier:tier,t:0,flash:0,
    fire:1.4,pi:-1,spin:0,q:[],alive:true,entering:true,enraged:false,
    patterns:bossPatternSet(tier,0),
    phase:0,aim:null,aimT:0};
}
/* 批次5:BOSS 攻擊組合。ph=形態(0/1/2),血量 66% 與 33% 時解鎖更多套路;
   同一時刻只施放一套,保持可預判節奏,不用隨機傳送。 */
function bossPatternSet(tier,ph){
  var t=Math.max(0,tier+DIF().pat);   /* 批次6:硬核提前解鎖套路,保守延後 */
  var L=[0,1,2,3,4,5].slice(0,Math.min(6,2+t));
  if(ph>=1){
    L=[0,1,2,3,4,5].slice(0,Math.min(6,3+t));
    L.push(6);L.push(7);
    /* 批次8:移除 p===11 橫向雷射(全場掃射無法閃避),不再push */
  }
  if(ph>=2){
    L.push(8);L.push(9);L.push(10);
  }
  return L;
}
/* bq:延遲施放。opt.ox=相對 BOSS 的橫向偏移(真橫向彈幕),
   opt.h=轉向速率(rad/s)、opt.hl=追蹤秒數、opt.w=飛彈尾焰。 */
function bq(b,delay,ang,spd,r,color,opt){b.q.push({t:delay,a:ang,s:spd,r:r,c:color,o:opt});}
function bossFire(b){
  var enr=b.enraged;
  var sp=(150+14*b.tier)*(enr?1.25:1);
  b.pi++;
  var p=b.patterns[b.pi%b.patterns.length];
  var pa=Math.atan2(player.y-b.y,player.x-b.x);
  var i,n;
  if(p===0){
    n=moN(enr?11:7);
    for(i=0;i<n;i++)bq(b,i*0.02,Math.PI/2+(i-(n-1)/2)*(0.16+0.02*b.tier),sp,7,'#ff6b81');
    tone({f:420,f2:200,t:0,dur:0.14,type:'sawtooth',vol:0.06});
  }else if(p===1){
    n=enr?5:3;
    for(i=0;i<n;i++)bq(b,i*0.11,pa+(Math.random()-0.5)*0.14,sp*1.5,6,'#ffd166');
    tone({f:1200,f2:600,t:0,dur:0.10,type:'square',vol:0.05});
  }else if(p===2){
    n=moN(14+4*b.tier+(enr?6:0));
    for(i=0;i<n;i++)bq(b,0,(i/n)*6.2832+b.spin,sp*0.8,6,'#b98cff');
    b.spin+=0.35;
    nz({t:0,dur:0.20,vol:0.10,freq:1400,f2:400});
  }else if(p===3){
    /* 彈牆 = 純時間串流(21 個網格 x 在 flush 時全部塌到 BOSS 位置),所以格數不乘 MO_SX、不套 moN(),
       而是由 MO_BOSS_WALL_CELLS 固定格數、網距 wallGap 只用 (W-50)/CELLS 反算,串流長度 = 格數 × 0.02s。
       gx 的橫向擾動是真正的橫向展開,所以乘 MO_SX;gw(開孔寬)的公式與數值維持原樣、不縮放,
       但「開孔判定」改成格數單位:門檻 = gw*wallGap/44(電腦版網距≈44,所以等於原 gw;
       手機版網距 17.62 時門檻同步縮到 22.4px),兩版都只吃掉約 2.5 格,手感一致。 */
    var gx=player.x+(Math.random()-0.5)*160*MO_SX,gw=Math.max(46,74-6*b.tier);
    var wallGap=(W-50)/MO_BOSS_WALL_CELLS;
    var gapCell=gw*wallGap/MO_BOSS_WALL_GAP;
    var k=0;
    for(var ci=0;ci<MO_BOSS_WALL_CELLS;ci++){
      var x=30+ci*wallGap;
      if(Math.abs(x-gx)<gapCell)continue;
      bq(b,k*0.02,Math.PI/2,sp*0.9,8,'#4ef2c0');k++;
    }
    tone({f:300,f2:160,t:0,dur:0.18,type:'square',vol:0.055});
  }else if(p===4){
    for(i=0;i<moN(10);i++)bq(b,i*0.055,b.spin+i*0.36,sp*1.05,6,'#7cff6b');
    b.spin+=0.72;
    tone({f:700,f2:1400,t:0,dur:0.16,type:'sawtooth',vol:0.05});
  }else if(p===6){
    /* 預警大扇形:先 0.45s 紅色瞄準線(細虛線由 BOSS 指向玩家),再沿同一線開出寬扇形 */
    n=enr?13:9;
    b.aim={t:0.45,a:pa};
    for(i=0;i<n;i++)bq(b,0.45+i*0.03,pa+(i-(n-1)/2)*0.135,sp*1.35,6,'#ff9f43');
    tone({f:250,f2:520,t:0,dur:0.22,type:'sawtooth',vol:0.05});
  }else if(p===7){
    /* 雙臂螺旋:兩條相反手臂同步射出,每次施放整組轉 30° → 手臂慢慢掃過畫面 */
    n=moN(7+b.tier);
    for(i=0;i<n;i++){
      bq(b,i*0.055,b.spin+i*0.30,sp*0.85,6,'#7cff6b');
      bq(b,i*0.055+0.028,b.spin+3.1416+i*0.30,sp*0.85,6,'#7cff6b');
    }
    b.spin+=0.52;
    tone({f:720,f2:1450,t:0,dur:0.16,type:'sawtooth',vol:0.045});
  }else if(p===8){
    /* 缺口環:慢速同心環固定留一個約 57° 缺口,缺口位置每次轉 50°(站在缺口方向即安全) */
    n=moN(15+2*b.tier);
    var g8=b.spin*0.8,a8;
    for(i=0;i<n;i++){
      a8=(i/n)*6.2832+b.spin;
      if(Math.abs(Math.atan2(Math.sin(a8-g8),Math.cos(a8-g8)))<0.50)continue;
      bq(b,(i%4)*0.05,a8,sp*0.55,6,'#b98cff');
    }
    b.spin+=0.87;
    nz({t:0,dur:0.20,vol:0.09,freq:1250,f2:520});
  }else if(p===9){
    /* 追蹤飛彈:慢速,轉向速率上限 1.15 rad/s 且只追 2.2s,亮尾焰辨識是飛彈 */
    n=2+(b.tier>=3?1:0);
    for(i=0;i<n;i++)bq(b,i*0.20,pa+(i-(n-1)/2)*0.55,104+10*b.tier,7,'#ff9f43',{h:1.15,hl:2.2,w:1});
    tone({f:330,f2:170,t:0,dur:0.18,type:'square',vol:0.05});
  }else if(p===10){
    /* 追身彈牆:真橫向彈幕(opt.ax 由各自的格 x 射出,不塌成時間串流)。
       缺口以「格數」判定:半寬 = gw/MO_BOSS_WALL_GAP 格(與 p3 同式),第一輪對準玩家,
       第二輪缺口往反方向移 3+(tier 上限 3) 格 → 必須橫向走位。 */
    var wg10=(W-50)/MO_BOSS_WALL_CELLS;
    var gc10=Math.max(1,Math.max(46,74-6*b.tier)/MO_BOSS_WALL_GAP);
    var pc10=Math.max(1,Math.min(MO_BOSS_WALL_CELLS-2,Math.round((player.x-30)/wg10)));
    for(var rw=0;rw<2;rw++){
      var hl10=pc10+(rw?-(3+Math.min(3,b.tier)):0);
      for(var c10=0;c10<MO_BOSS_WALL_CELLS;c10++){
        if(Math.abs(c10-hl10)<gc10)continue;
        bq(b,rw*0.55+c10*0.014,Math.PI/2,sp*0.85,8,'#4ef2c0',{ax:30+c10*wg10});
      }
    }
    tone({f:300,f2:160,t:0,dur:0.18,type:'square',vol:0.05});
  }else{
    var t2=['grunt','zig','diver'][(Math.random()*3)|0];
    var ec=Math.min(2+b.tier,Math.max(0,12-foes.length));   /* 批次5:援軍上限,不讓畫面被小怪淹沒 */
    for(i=0;i<ec;i++)spawnFoe(t2,60+Math.random()*(W-120),30+Math.random()*50);
    if(ec>0){bannerMain('敵援軍出現','',1.0,'#ffd166');SFX.growl();}
  }
}
/* 批次8:横向雷射套路(p===11)與 updateBeam() 已移除——全場掃射無法閃避 */
function updateBoss(dt){
  var b=boss;if(!b)return;
  b.t+=dt;
  if(b.flash>0)b.flash-=dt;
  for(var i=b.q.length-1;i>=0;i--){
    var s=b.q[i];s.t-=dt;
    if(s.t<=0){
      /* opt.ax = 螢幕絕對 x(真橫向彈幕),否則由 BOSS 位置射出 */
      foeBullet((s.o&&s.o.ax!==undefined)?s.o.ax:b.x,b.y+12,s.a,s.s,s.r,s.c,s.o);
      b.q.splice(i,1);
    }
  }
  if(b.aim){b.aim.t-=dt;if(b.aim.t<=0)b.aim=null;}
  if(b.entering){
    b.y+=70*dt;
    if(b.y>=110){b.entering=false;SFX.growl();}
    return;
  }
  /* 形態切換:血量 66% / 33% 解鎖新套路,並清掉未施放的佇列(避免换形態瞬間爆量) */
  var frac=b.hp/b.maxhp,dt2=DIF(),ph=(frac<dt2.ph2)?2:((frac<dt2.ph1)?1:0);
  if(ph!==b.phase){
    b.phase=ph;b.patterns=bossPatternSet(b.tier,ph);b.pi=-1;
    b.aim=null;b.q.length=0;
    if(ph===1){bannerMain('BOSS 第二形態','攻擊型態改變!',1.2,'#ff9f43');SFX.growl();ring(b.x,b.y,16,190,0.6,'#ff9f43',5);}
    else{bannerMain('BOSS 最終形態','全面解放!',1.2,'#ff4d6d');SFX.growl();ring(b.x,b.y,16,250,0.7,'#ff4d6d',6);}
  }
  var amp=(b.phase===1?W*0.34:(b.phase===2?W*0.26:W*0.30));
  b.x=W/2+Math.sin(b.t*(b.phase===2?0.78:0.62))*amp;
  b.y=(b.phase===2?100:110)+Math.sin(b.t*(b.phase===2?1.45:1.1))*(b.phase===2?30:22);
  if(!b.enraged&&b.hp<b.maxhp*0.35){
    b.enraged=true;
    bannerMain('BOSS 狂暴化','防禦崩壞!',1.4,'#ff4d6d');
    SFX.growl();ring(b.x,b.y,20,220,0.7,'#ff4d6d',6);
  }
  b.fire-=dt;
  if(b.fire<=0){
    b.fire=Math.max(0.55,1.6-0.13*b.tier)*(b.enraged?0.62:1)*easyGap();   /* 批次6:密度由難度檔决定(easyGap) */
    bossFire(b);
  }
}
function hurtBoss(dmg){
  var b=boss;if(!b||!b.alive)return;
  if(b.entering&&BOSS_SHIELD){b.flash=0.06;return;}
  b.hp-=dmg;b.flash=0.09;
  SFX.hit();
  if(b.hp<=0)killBoss();
}
function killBoss(){
  var b=boss;if(!b)return;
  b.alive=false;
  var tier=b.tier;

  for(var i=0;i<14;i++){
    var a=(i/14)*6.2832;

}

/* ============ 8. 玩家射擊(6種彈藥 + 可疊加強化) ============ */
function shotColor(){return AMMO[player.ammo].color;}
function firePlayer(dt){
  player.cool-=dt;
  if(!keys[' ']||player.cool>0||!player.alive)return;
  player.cool=fireInterval();
  var L=player.ammoLvl[player.ammo],k=player.ammo,a=AMMO[k];
  var dmg=shotDamage();
  var ox=[],ang=[];
  if(k==='pulse'){
    var n=1+Math.min(3,L-1);
    for(var i=0;i<n;i++)ox.push((i-(n-1)/2)*11);
  }else if(k==='spread'){
    var n2=3+(L-1)*2;
    var half=Math.min(0.62,0.16+(L-1)*0.05);
    for(var j=0;j<n2;j++)ang.push(-half+(j/(n2-1))*half*2);
  }else if(k==='laser'){
    var n3=1+Math.min(2,L-1);
    for(var m=0;m<n3;m++)ox.push((m-(n3-1)/2)*14);
  }else if(k==='plasma'){
    ox.push(0);
  }else if(k==='missile'){
    var n4=1+Math.min(2,L-1);
    for(var q=0;q<n4;q++)ox.push((q-(n4-1)/2)*16);
  }else{
    ox.push(0);
  }
  var nSh=Math.max(ox.length,ang.length);
  for(var s=0;s<nSh;s++)spawnShot(player.x+(ox[s]||0),player.y-14,ang[s]||0,dmg,L,a);
  for(var d=0;d<Math.min(SPREAD_CAP,player.up.spread);d++){
    for(var side=-1;side<=1;side+=2){
      spawnShot(player.x+side*(10+d*5),player.y-6,side*(0.12+d*0.022),dmg,L,a);
    }
  }
  SFX['shoot'+k.charAt(0).toUpperCase()+k.slice(1)]();
  shotN++;
  flash=Math.min(0.22,flash+0.02);
}
function spawnShot(x,y,ang,dmg,L,a){
  if(bullets.length>MO_CAP_BULLETS)return;
  var b={x:x,y:y,c:a.color,dmg:dmg,pierce:a.pierce+(L>=4?1:0),kind:a.kind,hit:false,
    hs:null,ang:ang,t:0,aoe:0,kb:0,w:4,h:12,turn:0,life:2.6,trail:0};
  var cs=Math.sin(ang),sn=Math.cos(ang);
  if(a.kind==='bolt'){
    b.vy=620*(1+0.05*(L-1));b.vx=cs/Math.max(cs,0.2)*0;
    b.vx=(Math.sin(ang)*700);b.w=3+L*0.5;b.h=13+L*1.5;
  }else if(a.kind==='laser'){
    b.vy=900;b.vx=Math.sin(ang)*900;b.w=3+L;b.h=34+L*4;b.pierce+=1;
  }else if(a.kind==='orb'){
    b.vy=340;b.vx=Math.sin(ang)*340;b.r=8+L*1.6;b.aoe=52+L*12;b.w=b.r;b.h=b.r;
  }else if(a.kind==='msl'){
    b.vy=250;b.vx=Math.sin(ang)*160;b.turn=3.6+L*0.4;b.w=5;b.h=13;b.warm=0.16;
  }else{
    b.vy=1500;b.vx=Math.sin(ang)*1500;b.w=3+L;b.h=90+L*14;b.kb=42;b.life=0.6;b.pierce+=3;
  }
  b.vy=-Math.abs(b.vy); /* 子彈一律向上飛行 */
  b.r=b.r||(a.kind==='orb'?8+L*1.6:Math.max(3.5,b.w*0.9));
  bullets.push(b);
}
function buildDroneShots(dt){
  for(var i=0;i<drones.length;i++){

    d.cool-=dt;
    if(d.cool>0||!player.alive)continue;

      dmg:shotDamage()*DRONE_DMG,pierce:0,kind:'bolt',hit:false,hs:null,ang:0,t:0,aoe:0,kb:0,life:2.2,turn:0,trail:0});
    tone({f:1500,f2:700,t:0,dur:0.05,type:'square',vol:0.015});
  }
}
function explodeShot(b){
  var pl=(b.kind==='orb');   /* 批次8:電漿=orb。爆炸本身與炸死非 BOSS 敵機都不再推畫面震動 */
  var bsHit=false;
  boom(b.x,b.y,b.aoe*0.45,b.c,true,pl?PLASMA_FOE_SHAKE:AOE_SHAKE,1);   /* 批次7:nofl=1 → 電漿/飛彈爆炸不再推全屏白閃 */
  glowBall(b.x,b.y,b.aoe*GLOW_SHOT,b.c);           /* 改在命中點畫局部光球(顏色跟武器一致) */
  ring(b.x,b.y,4,b.aoe,0.32,b.c,4);
  SFX.boom(0.6);
  if(pl)shakeMute=1;                               /* 電漿 AOE 波及的小怪/大怪死亡一律不震(含 tank/bomber/splitter) */
  for(var j=0;j<foes.length;j++){
    var f=foes[j];if(f.dead)continue;
    var dx=f.x-b.x,dy=f.y-b.y,rr=b.aoe+f.r;
    if(dx*dx+dy*dy<rr*rr)hitFoe(f,b.dmg*0.85,0);
  }
  if(pl)shakeMute=0;
  if(boss&&boss.alive){
    var d2=Math.sqrt((boss.x-b.x)*(boss.x-b.x)+(boss.y-b.y)*(boss.y-b.y));
    if(d2<b.aoe+boss.r){hurtBoss(b.dmg*0.85);bsHit=true;}
  }
  if(pl&&bsHit)shake=Math.min(26,shake+b.aoe*0.45*AOE_SHAKE);   /* 電漿打到 BOSS:原震動原封不動保留 */
}
function hitFoe(f,dmg,kb){
  if(f.dead)return;
  f.hp-=dmg;f.flash=0.09;
  if(kb)f.y-=kb;
  spark(f.x,f.y,'#ffffff',4,70);
  if(f.hp<=0)killFoe(f);
}
function killFoe(f){
  if(f.dead)return;
  f.dead=true;
  score+=f.score;
  boom(f.x,f.y,f.r,f.color,false,FOE_SHAKE,((FOES[f.type]?FOES[f.type].r:f.r)<FLASH_MIN_SIZE)?1:0);
  if(f.type==='splitter'){
    for(var i=0;i<2;i++){
      var m=spawnFoe('mini',f.x+(i?20:-20),f.y);
      if(m)m.ph=Math.random()*6.28;
    }
    ring(f.x,f.y,8,70,0.4,'#5ad1ff',4);
  }
  drop(f.x,f.y,(f.type==='tank'||f.type==='bomber'||f.type==='splitter')?BIG_DROP_CHANCE:null);
}
/* ---- 批次3:手機版「炸彈」(右下大鈕,點一下清場 + 傷 BOSS),PC 版沒有這個機制 ---- */

function moToggleMusic(){

function updateBullets(dt){
  for(var i=bullets.length-1;i>=0;i--){
    var b=bullets[i];
    b.t+=dt;
    if(b.turn){
      var tg=null,best2=1e9;
      for(var fI=0;fI<foes.length;fI++){
        var fo=foes[fI];if(fo.dead)continue;
        var dd=(fo.x-b.x)*(fo.x-b.x)+(fo.y-b.y)*(fo.y-b.y);
        if(dd<best2){best2=dd;tg=fo;}
      }
      if(boss&&boss.alive){
        var db=(boss.x-b.x)*(boss.x-b.x)+(boss.y-b.y)*(boss.y-b.y);
        if(db<best2)tg=boss;
      }
      if(tg){
        var want=Math.atan2(tg.y-b.y,tg.x-b.x);
        var cur=Math.atan2(b.vy,b.vx);
        var diff=want-cur;
        while(diff>Math.PI)diff-=6.2832;
        while(diff<-Math.PI)diff+=6.2832;
        var nt=Math.max(-b.turn*dt,Math.min(b.turn*dt,diff));
        var sp=Math.sqrt(b.vx*b.vx+b.vy*b.vy);
        var na=cur+nt;
        b.vx=Math.cos(na)*sp;b.vy=Math.sin(na)*sp;
      }
      b.trail-=dt;
      if(b.trail<=0){b.trail=0.03;trailPuff(b.x,b.y,b.c);}
    }
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.x<-110||b.x>W+110||b.y<-130||b.y>H+40||b.t>b.life){bullets.splice(i,1);continue;}
    var dead=false;
    for(var j=0;j<foes.length;j++){
      var f2=foes[j];if(f2.dead)continue;
      if(b.hs&&b.hs[f2.id])continue;
      var dx2=f2.x-b.x,dy2=f2.y-b.y,rr2=f2.r+b.r;
      if(dx2*dx2+dy2*dy2<rr2*rr2){
        hitFoe(f2,b.dmg,b.kb);
        if(b.aoe>0){explodeShot(b);dead=true;break;}
        if(b.pierce>0){b.pierce--;if(!b.hs)b.hs={};b.hs[f2.id]=1;}
        else{dead=true;break;}
      }
    }
    if(!dead&&boss&&boss.alive){
      var dx3=boss.x-b.x,dy3=boss.y-b.y,rr3=boss.r+b.r;
      if(dx3*dx3+dy3*dy3<rr3*rr3){
        hurtBoss(b.dmg);
        if(b.aoe>0){explodeShot(b);dead=true;}
        else if(b.pierce>0){b.pierce--;}
        else dead=true;
      }
    }
    if(dead)bullets.splice(i,1);
  }
}
/* ============ 9. 敵人更新 ============ */
function updateFoes(dt){
  for(var i=foes.length-1;i>=0;i--){
    var f=foes[i];
    if(f.dead){foes.splice(i,1);continue;}
    f.t+=dt;
    if(f.flash>0)f.flash-=dt;
    if(f.type==='grunt'){f.y+=f.spd*dt*MO_SY;f.x+=Math.sin(f.t*2+f.ph)*32*MO_SX*dt;}
    else if(f.type==='zig'){f.y+=f.spd*dt*MO_SY;f.x+=Math.sin(f.t*3.2+f.ph)*155*MO_SX*dt;}
    else if(f.type==='shooter'){
      if(f.y<180)f.y+=f.spd*dt*MO_SY;else f.x+=Math.sin(f.t*1.2+f.ph)*70*MO_SX*dt;
      f.fire-=dt;
      if(f.fire<=0&&f.y>10){f.fire=Math.max(0.9,1.9-wave*0.05)*easyGap()*lateFoe();foeShootAimed(f,(200+wave*5)*DIF().foeSpd);}
    }else if(f.type==='tank'){
      f.y+=f.spd*dt*MO_SY;f.spin+=dt;
      f.fire-=dt;
      if(f.fire<=0&&f.y>10){f.fire=2.3*easyGap()*lateFoe();fanFoe(f,3,Math.PI/2,0.24,190*DIF().foeSpd);}
    }else if(f.type==='bomber'){
      f.vy+=52*dt;f.y+=f.vy*dt*MO_SY;f.x+=Math.sin(f.t*1.5+f.ph)*45*MO_SX*dt;
      f.fire-=dt;
      if(f.fire<=0&&f.y>40&&f.y<H-150){
        f.fire=1.5*easyGap()*lateFoe();
        foeBullet(f.x,f.y+f.r,Math.PI/2,62,9,'#ff7b54');
        tone({f:200,f2:90,t:0,dur:0.12,type:'triangle',vol:0.05});
      }
    }else if(f.type==='diver'){
      if(f.vy<420)f.vy+=210*dt;
      var dxp=player.x-f.x;
      f.x+=Math.max(-170,Math.min(170,dxp*1.7))*MO_SX*dt;
      f.y+=(f.spd+f.vy*0.5)*dt*MO_SY;
      if(f.t>0.4&&f.t<0.6)trailPuff(f.x,f.y,'#ff5470');
    }else if(f.type==='splitter'){
      f.y+=f.spd*dt*MO_SY;f.x+=Math.sin(f.t*1.1+f.ph)*75*MO_SX*dt;f.spin+=dt*2;
    }else{
      f.y+=f.spd*dt*0.8*MO_SY;f.x+=Math.sin(f.t*5+f.ph)*130*MO_SX*dt;
    }
    if(f.x<8)f.x=8;if(f.x>W-8)f.x=W-8;
    if(f.y>H+40){foes.splice(i,1);continue;}
    if(player.alive&&player.inv<=0){
      var dx=f.x-player.x,dy=f.y-player.y,rr=f.r*0.82+MO_HIT_R;   /* 判定用 MO_HIT_R(視覺 r=15 不變) */
      if(dx*dx+dy*dy<rr*rr){
        hurtPlayer();
        if(f.type!=='tank'){f.dead=true;boom(f.x,f.y,f.r,f.color,true,FOE_SHAKE,((FOES[f.type]?FOES[f.type].r:f.r)<FLASH_MIN_SIZE)?1:0);}
      }
    }
  }
}
function updateFoeBullets(dt){
  for(var i=foeBullets.length-1;i>=0;i--){
    var b=foeBullets[i];
    b.t+=dt;
    if(b.h){                                  /* 批次5C:追蹤彈只限角速度,到期改直線(可預判甩開) */
      b.hl-=dt;
      if(b.hl<=0)b.h=0;
      else if(player.alive){
        var hsp=Math.sqrt(b.vx*b.vx+b.vy*b.vy);
        var ca=Math.atan2(b.vy,b.vx),ta=Math.atan2(player.y-b.y,player.x-b.x),da=ta-ca;
        while(da>Math.PI)da-=6.2832;while(da<-Math.PI)da+=6.2832;
        var mx=b.h*dt;
        if(da>mx)da=mx;else if(da<-mx)da=-mx;
        ca+=da;b.vx=Math.cos(ca)*hsp;b.vy=Math.sin(ca)*hsp;
      }
    }
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.t>7||b.x<-40||b.x>W+40||b.y<-60||b.y>H+40){foeBullets.splice(i,1);continue;}
    if(player.alive&&player.inv<=0){
      var dx=player.x-b.x,dy=player.y-b.y,rr=MO_HIT_R+b.r-2;      /* 敵彈判定同樣用 MO_HIT_R(此檔無 BOSS 本體撞擊判定) */
      if(dx*dx+dy*dy<rr*rr){
        foeBullets.splice(i,1);hurtPlayer();continue;
      }
    }
  }
}
function hurtPlayer(){
  if(player.inv>0||!player.alive)return;
  player.hp--;player.inv=1.7*DIF().inv;
  moVibe(28);                                   /* 玩家被擊中:短震一次(小怪死亡不震) */
  shake=Math.min(26,shake+15);flash=Math.min(0.6,flash+0.35);
  SFX.hurt();boom(player.x,player.y,10,'#ff6b81',true);
  if(player.hp<=0){
    player.alive=false;
    moVibe([80,60,120]);                        /* 玩家死亡:長震動 */
    for(var i=0;i<10;i++)boomQueue(player.x+(Math.random()-0.5)*40,player.y+(Math.random()-0.5)*40,10+Math.random()*10,'#7fe7ff',i*0.07);
    gameOver();
  }else{
    bannerMain('受損!','HP '+player.hp+' / '+player.maxhp,0.9,'#ff6b81');
  }
}
function gameOver(){

/* ============ 10. 掉落物(永久強化,無時間限制) ============ */
function upCap(k){
  if(k==='spread')return player.up.spread>=SPREAD_CAP;
  if(k==='drone')return player.up.drone>=DRONE_CAP-SHIPS[shipIdx].drones;
  return false;
}
function upWeight(k){
  /* 批次6:rapid/dmg 的掉落權重隨「已經抽到幾次」和「波數」遞減,後期不再無限疊爆 */
  var w=upW[k];
  if(k==='rapid'||k==='dmg'){
    w*=Math.max(LATE_UP_MIN,1-Math.max(0,wave-12)*LATE_UP);
    w*=Math.max(0.30,1-((player&&player.up[k])||0)*0.06);
  }
  return w;
}
function pickUp(){
  var ks=[],tot=0;
  for(var k in upW){if(upCap(k))continue;ks.push(k);tot+=upWeight(k);}
  if(!ks.length)return null;
  var r=Math.random()*tot;
  for(var i=0;i<ks.length;i++){r-=upWeight(ks[i]);if(r<=0)return ks[i];}
  return ks[ks.length-1];
}
function drop(x,y,forced){
  var r=Math.random(),type=null,data=null;
  /* forced: 'up'=必定給永久強化;數字=該敵機的掉落率;其他=用一般掉落率 */
  var chance=(forced==='up')?1:(typeof forced==='number'?forced:DROP_CHANCE);
  if(forced!=='up')chance=Math.min(1,chance*Math.max(LATE_DROP_MIN,1-Math.max(0,wave-12)*LATE_DROP)*DIF().drop);
  if(forced==='up'){type='up';data=dropPool[dropIdx++%dropPool.length];}
  else if(r<chance){
    var r2=Math.random();
    if(r2<Math.min(0.40,UP_SUB*DIF().upSub)){data=pickUp();if(data){type='up';}else type='hp';}
    else if(r2<0.46){type='hp';}
    else{type='ammo';data=AMMO_KEYS[(Math.random()*AMMO_KEYS.length)|0];}
  }
  if(!type)return;
  drops.push({x:x,y:y,vy:72,type:type,data:data,t:0,life:13,r:13});
}
function grantDrop(d){
  if(d.type==='up'){
    if(upCap(d.data)){
      score+=200;
      bannerMain(P[d.data].n+' 已達上限','多出的獎勵轉為分數 +200',1.1,P[d.data].c);
      SFX.pow();
    }else{
      player.up[d.data]++;
      if(d.data==='drone')dronesMake();
      var info=P[d.data];
      var lv=player.up[d.data];
      var cap=(d.data==='spread')?SPREAD_CAP:(d.data==='drone'?DRONE_CAP-SHIPS[shipIdx].drones:0);
      var tail=cap?('上限 '+cap+' 級'):'';
      bannerMain(info.n+' LV'+lv,tail||'永久疊加,不會消失',1.3,info.c);
      SFX.pow();
    }
  }else if(d.type==='hp'){
    player.hp=Math.min(player.maxhp,player.hp+1);
    bannerMain('修復 +1','HP '+player.hp+' / '+player.maxhp,0.9,'#7cff6b');
    SFX.pow();
  }else{
    var k=d.data,mx=AMMO[k].maxLv;
    player.ammoLvl[k]=Math.min(mx,player.ammoLvl[k]+1);
    player.ammo=k;
    bannerMain(AMMO[k].name+' LV'+player.ammoLvl[k],AMMO[k].desc,1.2,AMMO[k].color);
    SFX.ammo();
  }
  ring(player.x,player.y,6,60,0.35,'#ffffff',3);
}
function updateDrops(dt){
  for(var i=drops.length-1;i>=0;i--){
    var d=drops[i];
    d.t+=dt;d.y+=d.vy*dt;
    if(d.t>d.life||d.y>H+30){drops.splice(i,1);continue;}
    var dx=player.x-d.x,dy=player.y-d.y,rr=d.r+player.r+4;
    if(dx*dx+dy*dy<rr*rr){grantDrop(d);drops.splice(i,1);continue;}
    if(Math.abs(dy)<130){
      d.x+=(dx>0?26:-26)*dt*(1-Math.abs(dy)/150);
    }
  }
}
/* ============ 11. 主更新 ============ */
function update(dt,raw){
  menuT+=raw;
  shake=Math.max(0,shake-raw*38);
  flash=Math.max(0,flash-raw*2.4);
  if(banner.t<banner.dur)banner.t+=raw;
  if(slowT>0){slowT-=raw;if(slowT<=0)slowmo=1;}
  updateBooms(raw);
  updateParts(dt);
  updateRings(raw);
  if(state===S.CLEAR){updateClear(raw);return;}
  if(state!==S.PLAY)return;
  updateWaves(raw);
  /* player */
  keys[' ']=true;                    /* 手機版:遊玩中自動連射 */
  var lx=((keys.ArrowRight||keys.d||keys.D)?1:0)-((keys.ArrowLeft||keys.a||keys.A)?1:0);
  var ly=((keys.ArrowDown||keys.s||keys.S)?1:0)-((keys.ArrowUp||keys.w||keys.W)?1:0);
  player.x+=lx*player.speed*dt;player.y+=ly*player.speed*dt;
  if(MO_ST.down){                    /* 拖曳:朝手指目標緩動(時間常數 MO_DRAG_EASE),不瞬移 */
    var tg=moTouchTarget(),kk=1-Math.exp(-dt/MO_DRAG_EASE);
    var pxx=player.x;
    player.x+=(tg.x-player.x)*kk;player.y+=(tg.y-player.y)*kk;
    MO_BANK=Math.max(-1,Math.min(1,(player.x-pxx)/Math.max(0.001,player.speed*dt)));
  }
  player.x=Math.max(18,Math.min(W-18,player.x));
  player.y=Math.max(60,Math.min(H-24,player.y));
  player.bank+=(((lx*0.30)+(MO_ST.down?MO_BANK*0.30:0))-player.bank)*Math.min(1,dt*9);
  if(player.inv>0)player.inv-=dt;
  if(Math.random()<0.9)part(player.x-player.bank*30,player.y+16,(Math.random()-0.5)*30,
    150+Math.random()*90,0.22+Math.random()*0.14,1.6+Math.random()*1.6,
    (Math.random()<0.5?'#ffd166':'#7fe7ff'),true,0.7);
  firePlayer(dt);
  buildDroneShots(dt);
  for(var i=0;i<drones.length;i++){
    var dr=drones[i];
    dr.ang+=dt*1.7;
    var tx=player.x+Math.cos(dr.ang)*(30+i*9),ty=player.y+Math.sin(dr.ang)*(22+i*7)+6;
    dr.x+=(tx-dr.x)*Math.min(1,dt*7);dr.y+=(ty-dr.y)*Math.min(1,dt*7);
  }
  updateFoes(dt);
  updateBoss(dt);
  updateBullets(dt);
  updateFoeBullets(dt);
  updateDrops(dt);
}
function updateClear(dt){

function ngon(n,rad,rot){
  var p=[];
  for(var i=0;i<n;i++){
    var a=rot+i*6.2832/n;
    p.push([Math.cos(a)*rad,Math.sin(a)*rad]);
  }
  return p;
}

  var f=h*(0.75+Math.random()*0.5);
  poly([[x-w,y],[x,y+f],[x+w,y]],c1,null,0);
  poly([[x-w*0.45,y],[x,y+f*0.6],[x+w*0.45,y]],c2,null,0);
  glow(x,y+f*0.3,f*1.5,c1,0.4);

function bossCol(t){return ['#ff4d6d','#b98cff','#4ef2c0','#ffd166','#ff9f43','#7fe7ff','#ff5470'][(t-1)%7];}
/* BOSS 施放前的預警:瞄準虛線(畫在 BOSS 之下、敵彈之上) */
function drawBossAux(){
  var b=boss;if(!b||b.entering)return;
  if(b.aim){
    var L=Math.sqrt((player.x-b.x)*(player.x-b.x)+(player.y-b.y)*(player.y-b.y))+50;
    ctx.save();
    ctx.globalAlpha=0.30+0.26*Math.sin(b.t*26);
    ctx.strokeStyle='#ff5c5c';ctx.lineWidth=2;ctx.setLineDash([9,7]);
    ctx.beginPath();ctx.moveTo(b.x,b.y+10);
    ctx.lineTo(b.x+Math.cos(b.aim.a)*L,b.y+10+Math.sin(b.aim.a)*L);ctx.stroke();
    ctx.setLineDash([]);ctx.restore();
  }
}
function drawBoss(){
  var b=boss;if(!b)return;
  var R=b.r,c=bossCol(b.tier);
  ctx.save();
  ctx.translate(b.x,b.y);
  glow(0,0,R*2.1,c,0.22);
  glow(0,0,R*1.25,c,0.18);
  /* 外殼旋轉裝甲 */
  var sp=b.t*(b.enraged?1.5:0.7);
  for(var i=0;i<b.tier+3;i++){
    var a=sp+i*6.2832/(b.tier+3);
    ctx.save();
    ctx.translate(Math.cos(a)*R*1.06,Math.sin(a)*R*1.06);
    ctx.rotate(a);
    poly(ngon(4,R*0.20,0),'#0c1526',c,1.6);
    ctx.restore();
  }
  /* 主船體 */
  var fl=b.flash>0;
  poly(ngon(8,R,sp*0.15),fl?'#ffffff':'#131a2e',c,3);
  poly(ngon(8,R*0.78,sp*0.15),hexA(c,0.14),c,1.2);
  /* 側翼砲 */
  for(var s=-1;s<=1;s+=2){
    ctx.save();
    ctx.translate(s*R*0.86,R*0.25);
    poly([[-R*0.16,-R*0.22],[R*0.16,-R*0.22],[R*0.22,R*0.3],[-R*0.22,R*0.3]],'#0c1526',c,1.8);
    glow(0,R*0.34,R*0.2,c,0.6);
    ctx.restore();
  }
  /* 核心 */
  var pulse=1+0.1*Math.sin(b.t*(b.enraged?9:4));
  var ec=b.enraged?'#ffd166':c;
  glow(0,0,R*0.72*pulse,ec,0.75);
  poly(ngon(3,R*0.36*pulse,-sp*1.4),ec,null,0);
  ctx.fillStyle='#ffffff';
  ctx.beginPath();ctx.arc(0,0,R*0.16*pulse,0,6.2832);ctx.fill();
  /* 損傷裂縫 */
  if(b.hp<b.maxhp*0.55){
    ctx.globalAlpha=0.6;
    for(var k=0;k<4;k++){
      var a2=k*1.9+0.5;
      line(Math.cos(a2)*R*0.25,Math.sin(a2)*R*0.25,Math.cos(a2+0.6)*R*0.8,Math.sin(a2+0.6)*R*0.8,'#ff4d6d',1.6,0.6);
    }
    ctx.globalAlpha=1;
  }
  if(b.enraged){
    ctx.globalAlpha=0.35+0.2*Math.sin(b.t*10);
    ctx.strokeStyle='#ffd166';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(0,0,R*1.28,0,6.2832);ctx.stroke();
    ctx.globalAlpha=1;ctx.lineWidth=1;
  }
  ctx.restore();
  ctx.globalAlpha=1;
}
function drawBullets(){
  for(var i=0;i<bullets.length;i++){
    var b=bullets[i];
    ctx.save();
    ctx.translate(b.x,b.y);
    if(b.kind==='msl')ctx.rotate(Math.atan2(b.vy,b.vx)+1.5708);
    else if(b.ang)ctx.rotate(b.ang);
    if(b.kind==='bolt'){
      glow(0,0,b.w*3.4,b.c,0.45);
      ctx.fillStyle=b.c;ctx.fillRect(-b.w/2,-b.h/2,b.w,b.h);
      ctx.fillStyle='#ffffff';ctx.fillRect(-b.w*0.28,-b.h*0.36,b.w*0.56,b.h*0.72);
    }else if(b.kind==='laser'){
      glow(0,0,b.w*3.8,b.c,0.42);
      ctx.globalAlpha=0.9;ctx.fillStyle=b.c;ctx.fillRect(-b.w/2,-b.h/2,b.w,b.h);
      ctx.globalAlpha=1;ctx.fillStyle='#ffffff';ctx.fillRect(-b.w*0.3,-b.h/2,b.w*0.6,b.h);
      glow(0,-b.h/2,9,'#ffffff',0.6);
    }else if(b.kind==='orb'){
      var pu=1+0.13*Math.sin(b.t*13);
      glow(0,0,b.r*2.7*pu,b.c,0.55);
      ctx.globalAlpha=0.8;ctx.fillStyle=b.c;
      ctx.beginPath();ctx.arc(0,0,b.r*pu,0,6.2832);ctx.fill();
      ctx.globalAlpha=0.9;ctx.strokeStyle=b.c;ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(0,0,b.r*1.5*pu,0,6.2832);ctx.stroke();
      ctx.globalAlpha=1;ctx.lineWidth=1;ctx.fillStyle='#ffffff';
      ctx.beginPath();ctx.arc(-b.r*0.2,-b.r*0.24,b.r*0.4,0,6.2832);ctx.fill();
    }else if(b.kind==='msl'){
      flame(0,6,2.6,8,'#ffd166','#ffffff');
      poly([[0,-9],[-3.4,5],[0,2.6],[3.4,5]],'#0f2415',b.c,1.6);
      ctx.fillStyle=b.c;ctx.beginPath();ctx.arc(0,-2,1.8,0,6.2832);ctx.fill();
    }else{
      glow(0,0,b.w*4.2,b.c,0.4);
      ctx.globalAlpha=0.85;ctx.fillStyle=b.c;ctx.fillRect(-b.w/2,-b.h/2,b.w,b.h);
      ctx.globalAlpha=1;ctx.fillStyle='#ffffff';ctx.fillRect(-b.w*0.34,-b.h/2,b.w*0.68,b.h*0.82);
      glow(0,-b.h/2,16,'#ffffff',0.55);
    }
    ctx.restore();
    ctx.globalAlpha=1;
  }
}
function drawFoeBullets(){
  for(var i=0;i<foeBullets.length;i++){
    var b=foeBullets[i];
    var pu=1+0.14*Math.sin(b.t*11);
    if(b.w){                                  /* 追蹤飛彈:尾焰棒(朝速度反方向),一眼可辨 */
      var ta=Math.atan2(b.vy,b.vx);
      ctx.save();ctx.translate(b.x,b.y);ctx.rotate(ta);
      ctx.fillStyle=hexA(b.c,0.5);
      ctx.beginPath();ctx.moveTo(-b.r*0.5,0);ctx.lineTo(-b.r*3.1,-b.r*0.55);
      ctx.lineTo(-b.r*3.1,b.r*0.55);ctx.closePath();ctx.fill();
      ctx.restore();
    }
    glow(b.x,b.y,b.r*3*pu,b.c,0.5);
    ctx.fillStyle=b.c;
    ctx.beginPath();ctx.arc(b.x,b.y,b.r*pu,0,6.2832);ctx.fill();
    ctx.fillStyle='#ffffff';
    ctx.beginPath();ctx.arc(b.x,b.y,b.r*0.42*pu,0,6.2832);ctx.fill();
  }
  ctx.globalAlpha=1;
}
var UPCH={rapid:'速',dmg:'傷',spread:'擴',drone:'機'};
function drawDrops(){
  for(var i=0;i<drops.length;i++){
    var d=drops[i];
    var col=d.type==='hp'?'#7cff6b':(d.type==='ammo'?AMMO[d.data].color:P[d.data].c);
    var lbl=d.type==='hp'?'+':(d.type==='ammo'?AMMO[d.data].name.charAt(0):UPCH[d.data]);
    var bl=Math.sin(d.t*5)*2;
    var fade=d.t>d.life-2?(Math.sin(d.t*22)>0?0.35:1):1;
    var rr=d.r*(1+0.06*Math.sin(d.t*6));
    ctx.save();
    ctx.translate(d.x,d.y+bl);
    ctx.globalAlpha=fade;
    glow(0,0,d.r*2.7,col,0.55);
    /* 菱形外框(與敵機的多邊形外型明顯不同)+ 旋轉虛線環 */
    ctx.rotate(d.t*1.1);
    poly(ngon(4,rr*1.2,0),'#0b1424',col,2);
    poly(ngon(4,rr*0.66,0),hexA(col,0.3),col,1);
    ctx.rotate(-d.t*1.1);
    ctx.globalAlpha=fade*0.65;ctx.strokeStyle=col;ctx.lineWidth=1.5;
    ctx.setLineDash([4,4]);
    ctx.beginPath();ctx.arc(0,0,rr*1.72,d.t*2,d.t*2+6.2832);ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha=fade;
    ctx.fillStyle='#ffffff';
    ctx.beginPath();ctx.arc(-rr*0.5,-rr*1.5,1.8,0,6.2832);ctx.fill();
    text(lbl,0,5,14,'#ffffff','center',col,1);
    ctx.restore();
    ctx.globalAlpha=1;
  }
}

  dim(0.45);
  var k=Math.min(1,clearT*2);
  text('BOSS 擊破!',W/2,H*0.30,52,'#ffd166','center','#ffd166',k);
  text('第 '+(wave/5)+' 階旗艦已肅清',W/2,H*0.30+38,18,'#ffffff','center','',k);
  text('分數 '+score+'  ·  最佳 '+best,W/2,H*0.46,22,'#7fe7ff','center',null,k);
  if(clearT>0.9)text('獎勵:永久強化已送達',W/2,470,18,'#7cff6b','center','#7cff6b');
  if(clearT>1.4){
    var st=['射速+','傷害+','擴散+','無人機+'];
    for(var i=0;i<4;i++)text(st[i],W/2-105+i*70,512,13,'#ffd166');
  }
  /* ---- 批次3B:btnNext(繼續下一關)/btnMenu 大按鈕由 drawCtlButtons(true) 繪製;鍵盤 Enter 照舊 ---- */
  text('鍵盤:Enter 繼續',W/2,MO_END_BTN_Y+152,13,'#5d708f','center','',k);
  var rw=Math.min(1,clearT/1.1);
  ctx.globalAlpha=rw*0.6;
  for(var r2=0;r2<3;r2++){
    ctx.strokeStyle=['#ffd166','#7fe7ff','#ff6b81'][r2];ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(W/2,H*0.30,60+r2*26+clearT*14,0,6.2832);ctx.stroke();
  }
  ctx.globalAlpha=1;ctx.lineWidth=1;
}
/* ============ 14. 畫面合成 ============ */
function draw(raw){
  drawBG(state===S.PAUSE?0:raw);
  if(state===S.MENU){drawMenu(raw);return;}
  ctx.save();
  if(shake>0.3){
    ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
    ctx.rotate((Math.random()-0.5)*shake*0.0007);
  }
  drawBullets();                                  /* 任務1:玩家彈(含光暈/拖尾)放到最下層,不再蓋住敵彈與敵人 */
  drawDrops();
  drawRings();
  drawParts();                                    /* 命中火花/爆炸粒子(與敵方爆炸共用 parts,本來就在敵人之下) */
  drawFoeBullets();
  drawFoes();
  if(boss)drawBossAux();
  if(boss)drawBoss();
  drawDrones();
  drawPlayer();
  ctx.restore();
  ctx.globalAlpha=1;
  drawHUD();
  drawCtlButtons(false);                        /* 批次3A:螢幕按鈕(在 shake transform 之外,不跟着抖) */
  if(slowmo<1){
    ctx.globalAlpha=0.10;ctx.fillStyle='#7fe7ff';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;
  }
  if(flash>0.004){
    ctx.globalAlpha=Math.min(0.85,flash);
    ctx.fillStyle='#ffffff';ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=1;
  }
  if(state===S.PAUSE){drawPause();drawCtlButtons(true);}
  else if(state===S.OVER){drawOver();drawCtlButtons(true);}
  else if(state===S.CLEAR){drawClear();drawCtlButtons(true);}
}
/* ============ 15. 主迴圈 ============ */
var lastT=0;
function frame(ts){
  requestAnimationFrame(frame);
  if(ts===undefined)ts=0;
  if(!lastT)lastT=ts;
  var raw=(ts-lastT)/1000;
  lastT=ts;
  if(raw>0.06)raw=0.06;
  if(raw<0)raw=0;
  update(raw*slowmo,raw);
  draw(raw);
}
makeStars();
makeNebula();
requestAnimationFrame(frame);
window.__dbg={
  get:function(){return{state:state,bombs:bombs,score:score,wave:wave,foes:foes.length,bullets:bullets.length,
    foeBullets:foeBullets.length,drops:drops.length,parts:parts.length,drones:drones.length,
    rings:rings.length,bossQ:boss?boss.q.length:0,music:MUS.mode,ship:SHIPS[shipIdx].id,
    bossKills:bossKills,form:formQ.length,size:sizeIdx,sizeW:SIZES[sizeIdx].w,pauseIdx:pauseIdx,shake:shake,flash:flash,
    caps:{drone:DRONE_CAP,spread:SPREAD_CAP},hpScale:+bossHpScale().toFixed(3),
    tune:{dmgScale:DMG_SCALE,lvlDmg:LVL_DMG,upDmg:UP_DMG,drop:DROP_CHANCE,bigDrop:BIG_DROP_CHANCE,
      upSub:UP_SUB,formChance:FORM_CHANCE,formMin:FORM_MIN,formSize:FORM_SIZE,singleGap:SINGLE_GAP,
      droneDmg:DRONE_DMG,foeShake:FOE_SHAKE,aoeShake:AOE_SHAKE,waveHp:WAVE_HP,killHp:KILL_HP,musVol:MUS_VOL,flashMinSize:FLASH_MIN_SIZE,flashShot:FLASH_SHOT,glowShot:GLOW_SHOT,
      bossHp:[BOSS_HP0,BOSS_HP1,BOSS_HP2],hps:[HPS_UP,HPS_LV],
      rapidEff:RAPID_EFF,dmgSoft:DMG_SOFT,dmgSoftMul:DMG_SOFT_MUL,lateFrom:LATE_FROM,lateHp:LATE_HP,
      lateFire:LATE_FIRE,lateFireMul:LATE_FIRE_MUL,lateDrop:LATE_DROP,lateUp:LATE_UP,
      lateFoeNow:+lateFoe().toFixed(3),diffIdx:MO_DIFF,diffTable:DIF()},
    mix:{foesSingle:foesSingle,foesForm:foesForm},
    boss:boss?{hp:boss.hp,max:boss.maxhp,tier:boss.tier,enraged:boss.enraged,q:boss.q.length}:null,
    player:player?{hp:player.hp,maxhp:player.maxhp,ammo:player.ammo,lv:player.ammoLvl,up:player.up,
      rate:fireInterval(),dmg:shotDamage(),alive:player.alive}:null};},
  start:startGame,setState:setState,setWave:function(n){wave=n;},setShip:function(i){shipIdx=((i%SHIPS.length)+SHIPS.length)%SHIPS.length;},
  setAmmo:function(k){if(player)player.ammo=k;},
  setUp:function(k,v){if(player){player.up[k]=v;if(k==='drone')dronesMake();}},
  spawnFoe:spawnFoe,killFoe:killFoe,spawnShot:spawnShot,explodeShot:explodeShot,setShake:function(v){shake=v;},press:function(k){keys[k]=true;},release:function(k){keys[k]=false;},
  clearFoes:function(){foes.length=0;spawnLeft=0;formQ.length=0;betweenWaves=true;waveTimer=0;},
  hurtPlayer:hurtPlayer,nextWave:nextWave,startWave:startWave,
  grantDrop:grantDrop,killBoss:killBoss,hurtBoss:hurtBoss,spawnFormation:spawnFormation,
  dropRoll:function(n,ch){var c=0;for(var i=0;i<(n||100);i++){var b=drops.length;drop(0,-9999,ch);if(drops.length>b)c++;}return c/(n||100);},
  resetRun:reset,
  pauseAct:pauseAct,applySize:applySize,bossHpScale:bossHpScale,
  setPauseIdx:function(i){pauseIdx=i;},setSize:function(i){sizeIdx=((i%SIZES.length)+SIZES.length)%SIZES.length;applySize();},
  stepFrames:function(n){for(var i=0;i<(n||1);i++){update((1/60)*slowmo,1/60);draw(1/60);}},
  musicTick:musTick,ammoKeys:AMMO_KEYS,ships:SHIPS.length,foesTypes:Object.keys(FOES),
  touchStart:touchStart,touchMove:touchMove,touchEnd:touchEnd,
  fg:moVisibility,
  setDiff:function(v){moDiffSet(v?0:1);return MO_EASY;},   /* 相容舊測試:1=保守,0=中 */
  diff:function(){return MO_EASY;},
  setDiffIndex:function(i){moDiffSet(i);return MO_DIFF;},
  diffIndex:function(){return MO_DIFF;},
  diffName:function(){return MO_DIFF_NAME[MO_DIFF];},
  diffNames:function(){return MO_DIFF_NAME.slice();},
  mo:function(){return{W:MO_W,H:MO_H,SX:MO_SX,SY:MO_SY,fingerOff:MO_FINGER_OFF,fingerZone:MO_FINGER_ZONE,
    ease:MO_DRAG_EASE,hitR:MO_HIT_R,foeR:MO_FOE_R,textMin:MO_TEXT_MIN,invulnOnResume:MO_INVULN_ON_RESUME,
    wallCells:MO_BOSS_WALL_CELLS,wallGap:(MO_W-50)/MO_BOSS_WALL_CELLS,rowMax:MO_FORM_ROW_MAX,diff:MO_EASY,
    diffIdx:MO_DIFF,diffName:MO_DIFF_NAME[MO_DIFF],diffNames:MO_DIFF_NAME.slice(),
    caps:{bullets:MO_CAP_BULLETS,foeB:MO_CAP_FOEB}};},
  /* ---- 批次3A:狀態驅動按鈕表(3B 往 moUIBtnsRaw() push 新按鈕,這裡自動涵蓋) ---- */
  uiRects:moUIRects,tapBtn:moTapBtn,
  bombs:function(){return bombs;},
  btnNames:function(){var a=moUIBtns(),o=[],i;for(i=0;i<a.length;i++)o.push(a[i].name);return o;},
  musicOn:function(){return !!musicOn;}
};
